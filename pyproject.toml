[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "agent-evidence-mcp"
version = "0.1.0a1"
description = "Local MCP server for capturing screenshots, recordings, and reviewable evidence from long-running agent tasks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "xiexie-qiuligao" }
]
keywords = ["mcp", "screenshots", "recording", "agents", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
  "mcp>=1.27.0,<2.0.0",
  "tomli>=2.0.1; python_version < '3.11'"
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.0"]

[project.scripts]
agent-evidence-mcp = "task_evidence_mcp.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/task_evidence_mcp"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.git",
  "/.github",
  "/.pytest_cache",
  "/.uv-cache",
  "/.venv",
  "/artifacts",
  "/build",
  "/dist",
  "/tools",
  "**/__pycache__",
  "**/*.pyc",
  "agent-evidence-mcp.toml",
  "uv.lock",
]
